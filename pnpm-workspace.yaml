# pnpm 10 liest overrides/onlyBuiltDependencies nicht mehr aus package.json
# (siehe https://pnpm.io/settings) — neue verbindliche Position ist diese Datei.
packages:
  - "."

overrides:
  test-exclude: 7.0.1
  jsdom: 28.0.0
  hono: 4.12.7
  "@hono/node-server": 1.19.10
  lodash: 4.17.23
  markdown-it: 14.1.1
  ajv: 6.14.0
  "@eslint/config-array>minimatch": 3.1.4
  "@eslint/eslintrc>minimatch": 3.1.4
  "eslint>minimatch": 3.1.4
  "test-exclude>minimatch": 9.0.7

onlyBuiltDependencies:
  - "@prisma/engines"
  - better-sqlite3
  - esbuild
  - prisma
  - sharp
  - unrs-resolver

allowBuilds:
  '@prisma/engines': true
  better-sqlite3: true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
