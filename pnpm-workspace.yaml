# pnpm liest overrides und Build-Freigaben nur aus dieser Datei, nicht aus package.json.
# Die Overrides sind Mindestversionen innerhalb der Major-Linie (Sicherheits- bzw.
# Deprecation-Fixes), keine exakten Pins — sonst halten sie später verwundbare Stände fest.
packages:
  - "."

overrides:
  test-exclude: ^7.0.1
  jsdom: ^28.0.0
  hono: ^4.12.25
  "@hono/node-server": ^1.19.10
  lodash: ^4.17.24
  markdown-it: ^14.1.1
  ajv: ^6.14.0
  "@eslint/config-array>minimatch": ^3.1.4
  "@eslint/eslintrc>minimatch": ^3.1.4
  "eslint>minimatch": ^3.1.4
  "test-exclude>minimatch": ^9.0.7

allowBuilds:
  '@prisma/engines': true
  better-sqlite3: true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@next/env@16.3.7'
  - '@next/eslint-plugin-next@16.3.7'
  - '@next/swc-darwin-arm64@16.3.7'
  - '@next/swc-darwin-x64@16.3.7'
  - '@next/swc-linux-arm64-gnu@16.3.7'
  - '@next/swc-linux-arm64-musl@16.3.7'
  - '@next/swc-linux-x64-gnu@16.3.7'
  - '@next/swc-linux-x64-musl@16.3.7'
  - '@next/swc-win32-arm64-msvc@16.3.7'
  - '@next/swc-win32-x64-msvc@16.3.7'
  - eslint-config-next@16.3.7
  - next@16.3.7
  - nodemailer@10.0.13
