<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <pattern id="target" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
      <!-- Concentric circles (target motif) - center -->
      <circle cx="100" cy="100" r="40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
      <circle cx="100" cy="100" r="28" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="0.8"/>
      <circle cx="100" cy="100" r="16" fill="none" stroke="rgba(255,255,255,0.025)" stroke-width="0.6"/>
      <circle cx="100" cy="100" r="5" fill="rgba(255,255,255,0.03)"/>
      <!-- Crosshair lines -->
      <line x1="100" y1="55" x2="100" y2="75" stroke="rgba(255,255,255,0.025)" stroke-width="0.5"/>
      <line x1="100" y1="125" x2="100" y2="145" stroke="rgba(255,255,255,0.025)" stroke-width="0.5"/>
      <line x1="55" y1="100" x2="75" y2="100" stroke="rgba(255,255,255,0.025)" stroke-width="0.5"/>
      <line x1="125" y1="100" x2="145" y2="100" stroke="rgba(255,255,255,0.025)" stroke-width="0.5"/>
      <!-- Corner accent dots -->
      <circle cx="10" cy="10" r="1.5" fill="rgba(255,255,255,0.02)"/>
      <circle cx="190" cy="10" r="1.5" fill="rgba(255,255,255,0.02)"/>
      <circle cx="10" cy="190" r="1.5" fill="rgba(255,255,255,0.02)"/>
      <circle cx="190" cy="190" r="1.5" fill="rgba(255,255,255,0.02)"/>
    </pattern>
  </defs>
  <rect width="200" height="200" fill="url(#target)"/>
</svg>
